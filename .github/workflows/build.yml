name: Build Kissa AI Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK & Bundle
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "kissaai2026"
      KEY_PASSWORD: "kissaai2026"
      KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Build Release APK & AAB Bundle
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
