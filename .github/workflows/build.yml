name: Build Kissa AI Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Release APK & Bundle
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "kissaai2026"
      KEY_PASSWORD: "kissaai2026"
      KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Prepare environment file
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew || true

      - name: Verify Gradle Wrapper & Build Environment
        run: |
          chmod +x gradlew
          echo "Verifying Gradle wrapper..."
          if ! ./gradlew --version; then
            echo "Direct download timed out. Switching to Tencent Cloud mirror..."
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
            ./gradlew --version
          fi

      - name: Build Release APK & Bundle
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon || {
            echo "First attempt encountered network glitch. Retrying release build..."
            sleep 5
            ./gradlew assembleRelease bundleRelease --stacktrace --no-daemon
          }

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
