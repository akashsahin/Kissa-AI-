name: Build Kissa AI Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK & Bundle
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: "kissaai2026"
      KEY_PASSWORD: "kissaai2026"
      KEYSTORE_PATH: "${{ github.workspace }}/my-upload-key.jks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Executable Permissions
        run: |
          chmod +x gradlew || true

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi

      - name: Build Release Android App Bundle (AAB for Play Store)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --stacktrace
          else
            gradle bundleRelease --stacktrace
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Kissa-AI-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30
